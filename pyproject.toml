[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graspforge"
version = "0.1.0"
description = "Contact-rich parallel-gripper experiments and evaluation in MuJoCo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mujoco==3.11.0",
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.scripts]
graspforge = "graspforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graspforge = ["assets/*.xml"]


[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer simulation and robustness tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
